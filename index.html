<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Player Emulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
    <!-- Load the official Ruffle engine package -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- Native Ruffle Player element tags -->
    <ruffle-player>
        <param name="movie" value="familiarity.swf">
    </ruffle-player>

</body>
</html>
